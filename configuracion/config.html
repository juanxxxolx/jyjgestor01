<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JYJGESTOR | Configuración del Sistema</title>
    
    <link rel="stylesheet" href="config.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <main class="dashboard-content">

        <header class="content-header">
            <h1 class="page-title">Configuración del Sistema</h1>
        </header>

        <section class="config-container">
            
            <nav class="config-sidebar">
                <a href="#perfil" class="config-link active">
                    <svg data-lucide="user" class="link-icon"></svg>
                    Perfil
                </a>
                <a href="#seguridad" class="config-link">
                    <svg data-lucide="lock" class="link-icon"></svg>
                    Seguridad
                </a>
                <a href="#general" class="config-link">
                    <svg data-lucide="settings" class="link-icon"></svg>
                    General
                </a>
                <a href="#notificaciones" class="config-link">
                    <svg data-lucide="bell" class="link-icon"></svg>
                    Notificaciones
                </a>
            </nav>

            <div class="config-content">
                <h2 class="content-title">Ajustes de Perfil</h2>

                <div class="card-form">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" value="Juan M.">
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" value="juan.m@jyjgestor.com" disabled>
                    </div>
                    <div class="form-group">
                        <label for="rol">Rol del Sistema</label>
                        <input type="text" id="rol" value="Administrador" disabled>
                    </div>
                    
                    <button class="btn btn-primary save-button">
                        <svg data-lucide="save" class="icon-small"></svg>
                        Guardar Cambios
                    </button>
                </div>
            </div>

        </section>

    </main>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
