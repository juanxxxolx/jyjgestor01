<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>

    <link rel="stylesheet" href="cli.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <main class="dashboard-content">

        <header class="content-header">

            <h1 class="page-title">👥 Gestión de Clientes</h1>

            <div class="header-actions">

                <a href="../pagina_principal/pg_principal.html"
                   class="btn btn-secondary back-button">

                    <svg data-lucide="arrow-left"
                         class="icon-small"></svg>

                    Volver al Dashboard
                </a>

                <button class="btn btn-primary add-button">

                    <svg data-lucide="user-plus"
                         class="icon-small"></svg>

                    Añadir Nuevo Cliente
                </button>

            </div>

        </header>

        <section class="data-section">

            <div class="search-bar">

                <svg data-lucide="search"
                     class="search-icon"></svg>

                <input type="text"
                       id="searchInput"
                       placeholder="Buscar por nombre, email o teléfono...">

            </div>

            <div class="table-container">

                <table class="data-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Nombre Completo</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Tipo</th>
                            <th>Acciones</th>
                        </tr>

                    </thead>

                    <tbody>
                        <!-- CLIENTES -->
                    </tbody>

                </table>

            </div>

            <div class="table-footer">
                <p>Clientes cargados correctamente</p>
            </div>

        </section>

    </main>

    <!-- MODAL -->

    <div id="clientModal" class="modal">

        <div class="modal-content">

            <span class="close-button">&times;</span>

            <h2 class="modal-title">
                📝 Añadir Nuevo Cliente
            </h2>

            <form id="clientForm">

                <div class="form-group">

                    <label for="clientName">
                        Nombre Completo
                    </label>

                    <input type="text"
                           id="clientName"
                           name="clientName"
                           required>

                </div>

                <div class="form-group-grid">

                    <div class="form-group">

                        <label for="clientEmail">
                            Email
                        </label>

                        <input type="email"
                               id="clientEmail"
                               name="clientEmail"
                               required>

                    </div>

                    <div class="form-group">

                        <label for="clientPhone">
                            Teléfono
                        </label>

                        <input type="text"
                               id="clientPhone"
                               name="clientPhone"
                               required>

                    </div>

                </div>

                <div class="form-group">

                    <label for="clientAddress">
                        Dirección
                    </label>

                    <input type="text"
                           id="clientAddress"
                           name="clientAddress">

                </div>

                <div class="form-group">

                    <label for="clientType">
                        Tipo de Cliente
                    </label>

                    <select id="clientType"
                            name="clientType"
                            required>

                        <option value="retail">
                            Minorista
                        </option>

                        <option value="wholesale">
                            Mayorista
                        </option>

                        <option value="corp">
                            Corporativo
                        </option>

                    </select>

                </div>

                <div class="modal-actions">

                    <button type="submit"
                            class="btn btn-primary save-btn">

                        Guardar Cliente
                    </button>

                    <button type="button"
                            class="btn btn-secondary cancel-btn">

                        Cancelar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="../frontend/shared/api.js"></script>

    <script src="cli.js"></script>

</body>
</html>
