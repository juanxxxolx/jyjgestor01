<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - JYJGESTOR</title>

    <link rel="stylesheet" href="restablecer.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <h1>Recuperar Contraseña</h1>

        <p>
            Ingresa tu correo electrónico y te enviaremos instrucciones
            para restablecer tu contraseña.
        </p>

        <form id="recover-form">

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="tu.correo@ejemplo.com"
                    required
                >
            </div>

            <button type="submit">
                Enviar enlace de recuperación
            </button>

            <div id="message" class="message"></div>

        </form>

        <a href="../login/login.html" class="back-link">
            ← Volver al inicio de sesión
        </a>

    </div>

    <script>
        document.getElementById('recover-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const message = document.getElementById('message');

            message.textContent = 'Procesando solicitud...';

            try {
                const response = await fetch('http://localhost:3000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent =
                        data.message || 'Se enviaron las instrucciones a tu correo.';
                } else {
                    message.textContent =
                        data.message || 'Ocurrió un error.';
                }

            } catch (error) {
                message.textContent =
                    'No fue posible conectar con el servidor.';
            }
        });
    </script>

</body>
</html>
