<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    
    <link rel="stylesheet" href="g_productos.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <main class="dashboard-content">

        <header class="content-header">
            <h1 class="page-title">📦 Gestión de Productos</h1>
            <div class="header-actions">
                <a href="../pagina_principal/pg_principal.html" class="btn btn-secondary back-button">
                    <svg data-lucide="arrow-left" class="icon-small"></svg>
                    Volver al Dashboard
                </a>
                
                <button class="btn btn-primary add-button">
                    <svg data-lucide="package-plus" class="icon-small"></svg>
                    Añadir Nuevo Producto
                </button>
            </div>
        </header>

        <section class="data-section">
            <div class="search-bar">
                <svg data-lucide="search" class="search-icon"></svg>
                <input type="text" placeholder="Buscar por nombre, SKU o categoría...">
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>SKU</th>
                            <th>Nombre del Producto</th>
                            <th>Categoría</th>
                            <th>Precio Venta</th>
                            <th>Stock Actual</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Los datos se cargarán dinámicamente desde prod.js -->
                    </tbody>
                </table>
            </div>
            
            <div class="table-footer">
                <p>Mostrando 1 a 3 de 185 Productos</p>
            </div>
        </section>

    </main>
    
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 class="modal-title">📝 Añadir Nuevo Producto</h2>
            <form id="productForm">
                
                <div class="form-group">
                    <label for="productName">Nombre del Producto</label>
                    <input type="text" id="productName" name="productName" required>
                </div>
                
                <div class="form-group">
                    <label for="productSKU">SKU (Código)</label>
                    <input type="text" id="productSKU" name="productSKU" required>
                </div>
                
                <div class="form-group">
                    <label for="productDescription">Descripción</label>
                    <textarea id="productDescription" name="productDescription" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="productCategory">Categoría</label>
                    <input type="text" id="productCategory" name="productCategory" required>
                </div>
                
                <div class="form-group-grid">
                    <div class="form-group">
                        <label for="productCost">Costo Unitario</label>
                        <input type="number" id="productCost" name="productCost" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Precio de Venta</label>
                        <input type="number" id="productPrice" name="productPrice" step="0.01" required>
                    </div>
                </div>

                <div class="form-group-grid">
                    <div class="form-group">
                        <label for="productStock">Stock Inicial</label>
                        <input type="number" id="productStock" name="productStock" required>
                    </div>
                    <div class="form-group">
                        <label for="productMinStock">Stock Mínimo (Alerta)</label>
                        <input type="number" id="productMinStock" name="productMinStock" required>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary save-btn">Guardar Producto</button>
                    <button type="button" class="btn btn-secondary cancel-btn">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="../frontend/shared/api.js"></script>
    <script src="prod.js"></script>
</body>
</html>
