<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Asumo que login_.css contiene el estilo de esta página -->
    <link rel="stylesheet" href="login_.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <main class="main-container">
        <div class="presentation-box">
            
            <div class="logo-container">
                <svg data-lucide="gem" class="logo-icon"></svg>
                <h1 class="logo-text">JYJGESTOR</h1>
            </div>

            <h2 class="form-title">Iniciar Sesión</h2>

            <!-- 🚨 ID necesario para JS y quitamos action/method -->
            <form id="login-form" class="auth-form">
                
                <!-- 🚨 ID del input para email es 'email' -->
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu.correo@ejemplo.com" required>
                </div>
                
                <!-- 🚨 ID del input para password es 'password' -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                
                <!-- Contenedor de mensajes de error/éxito -->
                <div id="auth-message" style="margin-bottom: 15px; text-align: center; font-weight: bold;"></div>

                <button type="submit" class="btn btn-register full-width">
                    Acceder a JYJGESTOR
                </button>
            </form>
            
            <div class="form-footer">
                <p>¿No tienes cuenta? <a href="../registro/registro.html" class="footer-link">Regístrate aquí</a></p>
            </div>
             <div class="form-footer">
                <p>¿Olvidaste tu contraseña? <a href="../restablecer_contraseña/restablecer.html" class="footer-link">Ingresa aquí</a></p>
            </div>
            
        </div>
    </main>
    
    <script>
        lucide.createIcons();
    </script>
    
    <!-- 🚨 Enlace al script de autenticación al final del cuerpo -->
    <script src="auth.js"></script> 
</body>
</html>
